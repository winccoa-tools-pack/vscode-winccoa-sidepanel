name: Pre-Release (Develop)

on:
    push:
        branches:
            - develop
        paths-ignore:
            - "**.md"
            - ".github/**"
            - "!.github/workflows/pre-release.yml"
    workflow_dispatch:
        inputs: {}

permissions:
    contents: write
    pull-requests: write
    packages: write
    actions: write
    checks: write
    issues: write

jobs:
    pre-release:
        uses: winccoa-tools-pack/.github/.github/workflows/reusable-prerelease.yml@main
        with:
            target_branch: develop
            project_type: vscode
        secrets: inherit

    cleanup-old-prereleases:
        needs: [pre-release]
        if: always() && needs.pre-release.result == 'success'
        uses: winccoa-tools-pack/.github/.github/workflows/reusable-cleanup-prereleases-by-branch.yml@main
        with:
            target_branch: develop
            keep_latest: 3
        secrets: inherit
